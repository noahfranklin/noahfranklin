<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Noah Franklin — Security Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="12" fill="url(#glow)"/>

  <!-- accent bar -->
  <rect x="72" y="76" width="6" height="108" rx="3" fill="url(#accent)"/>

  <!-- name -->
  <text x="104" y="118" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Noah Franklin</text>

  <!-- title -->
  <text x="106" y="158" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.2">Security Engineer · Offensive Security · AI/LLM Infrastructure</text>

  <!-- tagline -->
  <text x="106" y="186" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#2dd4bf">threat-model first · ship second · verify by running</text>

  <!-- right-side monogram block -->
  <g transform="translate(1010 62)">
    <rect width="120" height="120" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <text x="60" y="78" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="url(#accent)">NF</text>
  </g>
</svg>
